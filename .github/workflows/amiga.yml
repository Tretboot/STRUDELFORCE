# STRUDELFORCE Amiga A500 CI
# ---------------------------------------------------------------------------
# Baut die 68k-Toolchain (jeffv03/amiga-gcc, Prefix /opt/amiga, gecacht),
# kompiliert strudelforce.amiga und packt strudelforce.adf (FFS, 880K)
# mit den Turrican-2 TFMX-Tracks (music/) + s/startup-sequence.
#
# Trigger:
#   - manuell (workflow_dispatch)
#   - Push auf main bei Quellen-Aenderung
#   - Tag v*        -> Release-Build, Artifact mit Versions-Suffix
# Artifact: strudelforce.adf + strudelforce.amiga (für WinUAE/VAMOS-Test).
# Hinweis: Der HAUPT-Dev-Workflow ist lokal via VS Code Extension
# BartmanAbyss.amiga-debug (m68k-amiga-elf-gcc, make program=...). Diese CI
# dient als Backup + Release-Fabrik (m68k-amigaos-gcc, ADF-Pipeline).
# ---------------------------------------------------------------------------
name: amiga-adf

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/*.c'
      - 'src/*.h'
      - 'Makefile'
      - 'tools/gen_sources.py'
      - '.github/workflows/amiga.yml'
    tags: ['v*']

env:
  REL: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set release suffix (Tag-Builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "REL=-$(git describe --tags --exact-match)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git gcc g++ lhasa rsync \
               libgmp-dev libmpfr-dev libmpc-dev flex gettext

      - uses: actions/cache@v4
        id: amiga-toolchain
        with:
          path: /opt/amiga
          key: amiga-gcc-jeffv03-master-v1

      - name: Build m68k-amigaos-gcc toolchain
        if: steps.amiga-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/jeffv03/amiga-gcc /opt/amiga-gcc-src
          cd /opt/amiga-gcc-src
          make binutils gcc libgcc libnix ixemul -j"$(nproc)"

      - name: Build strudelforce.amiga (68k)
        run: |
          ls -la /opt/amiga/bin/ | grep -i m68k || true
          make amiga_bin M68K_CC=/opt/amiga/bin/m68k-amigaos-gcc

      - name: Stage Turrican 2 music + build ADF
        run: |
          python3 -m pip install --quiet amitools
          make amiga_adf M68K_CC=/opt/amiga/bin/m68k-amigaos-gcc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strudelforce-amiga${{ env.REL }}
          path: |
            strudelforce.adf
            strudelforce.amiga