name: Build & Release

# STRUDELFORCE CI (aufgeraeumt 2026-10-29)
#   windows   : MSVC-Build (GUI + Terminal), Testsuite, Python-Oracle
#   linux     : GCC-Kerncheck + portable Testsuite
#   amiga     : m68k-amiga-elf-gcc (Toolchain aus der Bartman-VS-Code-Extension) -> amiga/out/a.exe + strudelforce.adf
#   release   : nur bei Tag v*; tools/make_release.py (Source via git archive/.gitattributes
#               export-ignore, Windows-ZIP, Amiga-ZIP, SHA256SUMS). Lizenzierte Ordner
#               (TFMX Professional/, MOD/) werden NIE mitgepackt.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build (build_msvc.bat)
        run: build_msvc.bat
        shell: cmd

      - name: Selftests
        run: |
          test_suite.exe
          strudelforce_game.exe --demo 2500 --no-intro --no-sound
          strudelforce_game.exe --campaign --demo 20000 --no-intro --no-sound
        shell: cmd

      - name: Python-Oracle (Endlos + Kampagne + Selftest)
        run: |
          python verify_core_sim.py --seed 1234 --ticks 2500
          python verify_core_sim.py --seed 1234 --campaign
          python tools/selftest.py
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            strudelforce.exe
            strudelforce_game.exe
          if-no-files-found: error

  linux:
    name: Linux (GCC Kern & Testsuite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: GCC-Kern-Check (C99, Wall/Wextra)
        run: |
          gcc -std=c99 -Wall -Wextra -Isrc -c src/game_logic.c -o /tmp/game_logic.o
          gcc -std=c99 -Wall -Wextra -Isrc -c src/engine_core.c -o /tmp/engine_core.o
          gcc -std=c99 -Wall -Wextra -Isrc -c src/soundengine_core.c -o /tmp/soundengine_core.o
          gcc -std=c99 -Wall -Wextra -Isrc -c src/level_engine.c -o /tmp/level_engine.o

      - name: Integrationstest
        run: |
          gcc -std=c99 -O2 -Isrc src/test_suite.c src/game_logic.c src/engine_core.c src/soundengine_core.c src/level_engine.c -lm -o /tmp/test_suite
          /tmp/test_suite

      - name: Python-Oracle
        run: |
          python3 verify_core_sim.py --seed 1234 --ticks 2500
          python3 verify_core_sim.py --seed 1234 --campaign
          python3 tools/selftest.py

  amiga:
    name: Amiga (m68k-amiga-elf-gcc + ADF)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Die Toolchain steckt in der .vsix der Extension (bin/linux/opt/bin + elf2hunk).
      # ANPASSEN, falls der Fork ein eigenes Release nutzt: --repo <owner>/<fork>.
      - uses: actions/cache@v4
        id: toolchain
        with:
          path: .toolchain
          key: amiga-elf-toolchain-v1

      - name: Toolchain aus der Bartman-Extension holen
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchain/vsix
          gh release download --repo BartmanAbyss/vscode-amiga-debug --pattern '*.vsix' --dir .toolchain/vsix
          cd .toolchain && unzip -q vsix/*.vsix 'extension/bin/linux/*'
          chmod -R +x extension/bin/linux

      - name: Amiga-Binary bauen (make -C amiga)
        run: |
          BIN="$PWD/.toolchain/extension/bin/linux"
          export PATH="$BIN/opt/bin:$BIN:$PATH"
          m68k-amiga-elf-gcc --version | head -1
          mkdir -p amiga/obj amiga/out
          make -C amiga

      - name: ADF bauen
        run: |
          python3 -m pip install --quiet --break-system-packages amitools
          python3 tools/build_amiga_adf.py

      - uses: actions/upload-artifact@v4
        with:
          name: amiga
          path: |
            strudelforce.adf
            amiga/out/a.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release (v*)
    needs: [windows, linux, amiga]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: amiga
          path: .

      - name: Release-Pakete bauen (nur relevante Dateien)
        run: |
          mkdir -p amiga/out && mv -f a.exe amiga/out/a.exe 2>/dev/null || true
          python3 tools/make_release.py
          ls -la release_out

      - uses: softprops/action-gh-release@v2
        with:
          files: release_out/*
          generate_release_notes: true
