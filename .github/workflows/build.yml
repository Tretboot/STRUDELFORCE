name: Build & Release

# STRUDELFORCE CI & Automated Release (v0.3.0 Consolidated Monolith)
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows (MSVC Consolidated Monolith)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (build_msvc.bat)
        run: build_msvc.bat
        shell: cmd

      - name: Selftests (Integrationstest-Suite & Terminal-Demos)
        run: |
          test_suite.exe
          strudelforce_game.exe --demo 2500 --no-intro --no-sound
          strudelforce_game.exe --campaign --demo 20000 --no-intro --no-sound
        shell: cmd

      - name: Python-Oracle (Endlos + Kampagne + Selftest)
        run: |
          python verify_core_sim.py --seed 1234 --ticks 2500
          python verify_core_sim.py --seed 1234 --campaign
          python tools/selftest.py

      - name: Upload Windows-Binaries
        uses: actions/upload-artifact@v4
        with:
          name: strudelforce-windows-v0.3.0
          path: |
            strudelforce.exe
            strudelforce_0.3.exe
            strudelforce_game.exe
            test_suite.exe

  linux-gcc:
    name: Linux (GCC Monolith & Portabler Selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GCC-Kern-Check (C99, Wall/Wextra)
        run: |
          gcc -std=c99 -Wall -Wextra -Isrc -c src/game_logic.c -o /tmp/game_logic.o
          gcc -std=c99 -Wall -Wextra -Isrc -c src/engine_core.c -o /tmp/engine_core.o
          gcc -std=c99 -Wall -Wextra -Isrc -c src/soundengine_core.c -o /tmp/soundengine_core.o

      - name: Linux Integrationstest (test_suite)
        run: |
          gcc -std=c99 -O2 -Isrc src/test_suite.c src/game_logic.c src/engine_core.c src/soundengine_core.c -lm -o test_suite
          ./test_suite

      - name: Python-Oracle (Endlos + Kampagne + Selftest)
        run: |
          python3 verify_core_sim.py --seed 1234 --ticks 2500
          python3 verify_core_sim.py --seed 1234 --campaign
          python3 tools/selftest.py

  release:
    name: Publish GitHub Release (v*)
    needs: [windows-msvc, linux-gcc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows Binaries
        run: build_msvc.bat
        shell: cmd

      - name: Package Release ZIP
        shell: pwsh
        run: |
          mkdir release_dist
          Copy-Item strudelforce.exe release_dist/
          Copy-Item strudelforce_0.3.exe release_dist/
          Copy-Item strudelforce_game.exe release_dist/
          Copy-Item test_suite.exe release_dist/
          Copy-Item README.md release_dist/
          Copy-Item RELEASE_0.3.0.md release_dist/ -ErrorAction SilentlyContinue
          if (Test-Path "TFMX Professional/Turrican 2") {
            New-Item -ItemType Directory -Path "release_dist/TFMX Professional/Turrican 2" -Force
            Copy-Item "TFMX Professional/Turrican 2/*" "release_dist/TFMX Professional/Turrican 2/"
          }
          if (Test-Path "TFMX Professional/Apidya") {
            New-Item -ItemType Directory -Path "release_dist/TFMX Professional/Apidya" -Force
            Copy-Item "TFMX Professional/Apidya/*" "release_dist/TFMX Professional/Apidya/"
          }
          Compress-Archive -Path release_dist/* -DestinationPath strudelforce-v0.3.0-windows-x64.zip
          $hash = (Get-FileHash strudelforce-v0.3.0-windows-x64.zip -Algorithm SHA256).Hash
          "$hash  strudelforce-v0.3.0-windows-x64.zip" | Out-File -Encoding utf8 SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            strudelforce-v0.3.0-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
